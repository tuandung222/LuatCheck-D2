version: '3.8'

# Docker Compose configuration optimized for Docker Desktop on macOS & Windows
services:
  local-slm-cpu:
    container_name: local-slm-cpu
    build:
      context: .
      dockerfile: Dockerfile
    # Port mapping for macOS and Windows Docker Desktop
    ports:
      - "8501:8501"
    environment:
      - MODEL_PROVIDER=ollama
      - MODEL_NAME=qwen2.5:3b
      # On macOS & Windows, host.docker.internal routes to the host machine's Ollama instance
      - MODEL_ENDPOINT=http://host.docker.internal:11434
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
