# Rebuild the HCMUT academic-regulations corpus with the generic ingestion pipeline.
# Provenance (URL, listing number/date, retrieval time, verification note, expected sha256) is NOT retyped here:
# it is read from docs/materials/hcmut-sources/manifest.json by `metadata_from`, and the build refuses to attach
# it to a PDF whose sha256 differs from the one recorded there.
# Output goes to a NEW path; data/corpus/hcmut_academic_v1.json is not touched.
#   .venv/bin/python -m src.ingestion build --config config/ingestion/hcmut_academic.yaml
# Excluded: CTDT3538 (115 pages, included_in_corpus: false in the collection manifest).
version: 1
output:
  corpus: data/corpus/hcmut_academic_ingested.json
  manifest: data/corpus/hcmut_academic_ingested.manifest.json
defaults:
  collection_id: hcmut_academic
  ruleset: vi_legal
  ruleset_options:
    # Most files are a signing decision (its own Điều 1-3) followed by the attached regulation, whose numbering
    # restarts at 1. The two article series get distinct ids: <doc>_QD_Dieu_1 (decision) and <doc>_Dieu_1.
    series_tags: ["QD_", ""]
  chunking:
    granularity: article
    content_whitespace: collapse
  ids:
    prefix: "HCMUT_"
    templates:
      article: "{prefix}{doc_code}_{series_tag}Dieu_{num}"
      appendix: "{prefix}{doc_code}_PhuLuc_{num_ascii}"
      chapter: "{prefix}{doc_code}_{series_tag}Chuong_{num_ascii}"
      part: "{prefix}{doc_code}_{series_tag}Phan_{num_ascii}"
      document: "{prefix}{doc_code}"
sources:
  - path: docs/materials/hcmut-sources/HVDT1260_1260-QD-DHBK_2026_sua-doi-quy-dinh-hoc-vu-va-dao-tao.pdf
    doc_code: HVDT1260
    metadata_from:
      file: docs/materials/hcmut-sources/manifest.json
      records_key: documents
      match: {doc_code: HVDT1260}
      verify_sha256_field: sha256
      fields:
        source_name: title
        url: source_url
        document_number: document_number
        issued_date: issued_date
        retrieved_at: retrieved_at
        metadata_verification: metadata_verification
  - path: docs/materials/hcmut-sources/HVDT2749_2749-QD-DHBK_2026_sua-doi-quy-dinh-hoc-vu-va-dao-tao.pdf
