# Two corpora in one index; records keep their own collection_id (labour code records get the default below),
# so `filter: {collection_id: hcmut_academic}` restricts keyword and vector search to one domain.
name: multi_domain_vi
corpora:
  - path: data/corpus/labor_code_2019_official.json
    collection_id: labor_code_2019
  - path: data/corpus/hcmut_academic_v1.json      # records already carry collection_id: hcmut_academic
chunking: {max_tokens: 512, overlap_tokens: 64, contextual_title: true}
retrieval:
  embedding:
    provider: sentence_transformers
    model: AITeamVN/Vietnamese_Embedding
    device: auto
    batch_size: 4
    max_seq_length: 2048
    wait_for_quiet_machine_gb: 2.0
  keyword_index: {backend: sqlite_fts5, tokenizer: "unicode61 remove_diacritics 0", title_weight: 2.0}
  vector_stores:        # FAISS is written in a separate process by copying the numpy store's vectors (torch/faiss libomp clash)
    - {backend: numpy, collection: chunks, metric: cosine}
    - {backend: faiss, name: faiss_hnsw, collection: chunks, metric: cosine, index_type: hnsw, hnsw_m: 32, ef_construction: 200, ef_search: 128}
  default_store: numpy
