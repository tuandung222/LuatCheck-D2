  - {run: d2-gpu-r2-2b-hcmut-v1, commit: cdb6b24, reason: "chosen D2 system runs (post-hoc revision r2, harness 1.2.0); frozen as reported"}
  - {run: d2-gpu-r2-2b-labour-v1, commit: cdb6b24, reason: "chosen D2 system runs (post-hoc revision r2, harness 1.2.0); frozen as reported"}
  - {run: d2-gpu-r2-4b-hcmut-v1, commit: cdb6b24, reason: "chosen D2 system runs (post-hoc revision r2, harness 1.2.0); frozen as reported"}
  - {run: d2-gpu-r2-4b-labour-v1, commit: cdb6b24, reason: "chosen D2 system runs (post-hoc revision r2, harness 1.2.0); frozen as reported"}
  - {run: d2-mac-latency-r2-4b-l1rr-v1, commit: 8cdd28d, reason: "Mac latency of the chosen system (verifier + reranker); frozen as reported"}
