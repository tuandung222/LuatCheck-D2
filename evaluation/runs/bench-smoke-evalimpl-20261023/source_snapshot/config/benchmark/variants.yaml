# D2 variants, selected through configuration only. `verification_mode` is passed to LuatCheckAgent;
# `overrides` is deep-merged into the AppConfig dump before validation. The runner refuses to run a variant whose
# overrides are not honoured by the installed src/ config: there is no runner-side emulation.
#
# A reranking variant states WHAT is compared (enabled, top_k_in -> top_k_out, max_length). WHERE the reranker runs
# (backend, model, device, dtype, base_url) comes from the run profile (config/benchmark/profile_*.yaml `reranker:`),
# so the same variant definition runs on the Mac (llama.cpp GGUF server) and on the GPU server (torch fp16 on CUDA).
# A key set both here and in the profile must agree; a run profile without a `reranker:` block cannot run this variant.
variants:
  "off":
    description: Verification off (L1 and repair disabled)
    verification_mode: "off"
    overrides: {}
  l1:
    description: L1 lexical grounding verification on, with repair
    verification_mode: l1_on
    overrides: {}
  l1_rerank:
    description: L1 on plus second-stage reranking of the first-stage candidates (runtime from the run profile)
    verification_mode: l1_on
    overrides:
      retrieval:
        reranker:
          enabled: true
          top_k_in: 20
          top_k_out: 5
          max_length: 1024

# Paired variant comparisons reported with a paired task-level bootstrap (baseline -> treatment). Add a line to add a comparison.
comparisons:
  - {baseline: "off", treatment: l1, label: "L1 vs OFF"}
  - {baseline: l1, treatment: l1_rerank, label: "L1+rerank vs L1"}
  - {baseline: "off", treatment: l1_rerank, label: "L1+rerank vs OFF"}
