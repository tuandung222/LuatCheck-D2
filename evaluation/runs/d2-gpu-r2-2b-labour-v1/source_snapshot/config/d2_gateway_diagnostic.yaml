# Diagnostic comparison, NOT the frozen D2 protocol (config/d2_native.yaml).
# Same tasks, corpus, prompt, loop, budgets and L1 checks; only the controller model changes,
# to separate task difficulty from small-model weakness. Remote API: benchmark questions,
# statutory text and model outputs are sent to the gateway (no user data).
# Output cap is raised to 2048 because reasoning tokens count against it; reasoning effort is low.
model:
  provider: gateway
  endpoint: https://ai-gateway01.qualgo.ai/v1
  name: openai/gpt-5.5
  api_key_env: LUATCHECK_JUDGE_API_KEY
  reasoning_effort: low
  temperature: 0.1
  timeout_seconds: 60
  max_output_tokens: 2048
  context_tokens: 8192
budgets:
  max_tool_calls: 5
  max_repairs: 2
  max_steps: 8
  wall_seconds: 180
retrieval:
  corpus_path: data/corpus/labor_code_2019_official.json
  dense_model_type: tfidf
  final_top_k: 5
  rrf_k: 60
verifier:
  mode: l1
  l2_use_slm: false
memory:
  enabled: false
  similarity_threshold: 0.85
  index_version: bll2019-official-220-v1
security:
  egress_requires_confirmation: true
