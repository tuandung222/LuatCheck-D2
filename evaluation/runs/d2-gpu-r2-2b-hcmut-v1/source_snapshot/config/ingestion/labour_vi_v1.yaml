# Labour-law source corpus "labour_vi" v1: 10 official Vietnamese labour/employment documents.
# Sources, provenance and caveats: docs/materials/labour-sources/README.md and manifest.json.
#   .venv/bin/python -m src.ingestion build --config config/ingestion/labour_vi_v1.yaml
# Output is a NEW corpus. data/corpus/labor_code_2019_official.json is frozen and is never written here.
version: 1
output:
  corpus: data/corpus/labour_vi_v1.json
  manifest: data/corpus/labour_vi_v1.manifest.json
defaults:
  collection_id: labour_vi
  ruleset: vi_legal
  ruleset_options:
    contiguous_articles: warn        # gaps are reported as manifest warnings, not hidden or repaired
  chunking:
    granularity: article             # one record per Điều; clauses/points stay inside it
    content_whitespace: collapse     # same single-space representation as the legacy labour corpus
  ids:
    templates:
      document: "{doc_code}"
      part: "{doc_code}_Phan_{num_ascii}"
      chapter: "{doc_code}_Chuong_{num_ascii}"
      muc: "{parent}_Muc_{num_ascii}"
      appendix: "{doc_code}_PhuLuc_{num_ascii}"
      article: "{doc_code}_Dieu_{num_ascii}"
sources:
  # 1. Bộ luật Lao động 2019: existing official Công báo PDF, used as-is (page-limit exception).
  - path: docs/materials/benchmark-sources/bll2019-congbao.pdf
    url: https://congbaocdn.chinhphu.vn/CongBaoCP/VanBan/2019/11/30232/29070-1-2019993-99445-2019-qh14.pdf
    doc_code: BLLD2019
    source_name: Bộ luật Lao động 2019
    title: Bộ luật Lao động 2019
    document_number: 45/2019/QH14
    issued_date: "2019-11-20"
    ruleset_options:
      contiguous_articles: error
      end_markers: ['^CHỦ TỊCH QUỐC HỘI']   # same signature-block override as config/ingestion/labor_code_2019.yaml
    metadata:
      issuing_body: Quốc hội
      effective_date: "2021-01-01"
      gazette_issue: "Công báo số 993 + 994, ngày 26-12-2019"
      verification: "Number, adoption date and effective date printed in the PDF. Retrieval time not recorded in docs/materials/benchmark-sources/corpus_manifest.json."

  # 2. Luật Việc làm (repeals Luật 38/2013/QH13 as amended).
  - path: docs/materials/labour-sources/LVL2025_74-2025-QH15.pdf
