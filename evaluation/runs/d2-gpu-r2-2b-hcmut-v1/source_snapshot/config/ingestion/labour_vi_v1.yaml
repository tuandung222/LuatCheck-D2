      issuing_body: Quốc hội
      effective_date: "2026-01-01"
      gazette_issue: "Công báo số 967 + 968, ngày 24-7-2025"
      retrieved_at_utc: "2026-10-22T21:22:28Z"
      verification: "Number, adoption date (16/6/2025) and effective date printed in the PDF. Gazette date from congbao.chinhphu.vn listing."

