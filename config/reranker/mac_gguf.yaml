# Reranker for the Mac (demo + latency): AITeamVN/Vietnamese_Reranker @ f536976 as GGUF on a loopback llama.cpp server.
# Weights: scripts/reranker/build_gguf.sh   Server: scripts/reranker/serve_mac.sh f16   (127.0.0.1:8082; Q8_0 = smaller, less faithful)
# Merge under the app/benchmark config (it is exactly the `retrieval.reranker` block of AppConfig / RerankerConfig).
# Same input policy as config/reranker/gpu_cuda.yaml (see docs/plans/reranker.md): candidates longer than chunk_chars
# characters are scored window by window (max window score = document score) and every (query, window) pair is capped
# at max_length tokens, longest_first.  A missing/stopped server is an execution error, never a silent skip.
retrieval:
  reranker:
    enabled: true                      # true: rerank; false: first-stage order (explicit configuration only)
    backend: llamacpp_http             # client = src.retrieval.rerankers.LlamaCppReranker (POST /v1/rerank)
    base_url: http://127.0.0.1:8082    # loopback only
    model: Vietnamese_Reranker-f16     # served alias (serve_mac.sh --alias); checked against GET /v1/models
    top_k_in: 20                       # first-stage candidates scored
    top_k_out: 5                       # candidates returned after reranking
    max_length: 1024                   # token cap per (query, window) pair, enforced client-side (server /tokenize)
    timeout_seconds: 60
    # chunk_chars / chunk_overlap_chars (policy default 1500 / 200 characters) are class defaults of LlamaCppReranker and
    # CrossEncoderReranker; they are not RerankerConfig keys yet (see docs/plans/reranker.md, "Wiring").
